    <div id="root"></div>
    <div id="boot-shell" aria-hidden="true">
        <style>
          html,
          body {
            margin: 0;
            padding: 0;
            background: #f3e5d2;
          }

          #boot-shell {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            pointer-events: none;
            background-color: #f3e5d2;
          }

          #boot-title {
            position: absolute;
            top: 80px;
            left: 50%;
            width: max-content;
            max-width: calc(100vw - 40px);
            margin: 0;
            transform: translateX(-50%);
            color: #493022;
            font-family: "DM Serif Display", Georgia, serif;
            font-size: 36px;
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: -0.025em;
            text-align: center;
          }

          #boot-title .boot-rays {
            display: inline-block;
            width: 26px;
            height: 26px;
            margin-left: 0.5rem;
            margin-top: -1.5rem;
            vertical-align: middle;
            color: rgba(73, 48, 34, 0.75);
          }

          #boot-title .boot-accent {
            position: relative;
            display: inline-block;
            isolation: isolate;
            margin-top: 0.25rem;
            font-style: italic;
          }

          #boot-title .boot-accent::before {
            content: "";
            position: absolute;
            z-index: -1;
            left: -0.07em;
            right: -0.07em;
            bottom: 0.04em;
            height: 0.84em;
            transform: rotate(-1.5deg);
            background: linear-gradient(180deg, rgba(214, 139, 128, 0.82), rgba(214, 139, 128, 0.7));
            clip-path: polygon(1% 24%, 5% 14%, 12% 17%, 19% 7%, 31% 13%, 42% 3%, 54% 11%, 67% 5%, 79% 13%, 91% 8%, 99% 18%, 98% 81%, 92% 88%, 81% 80%, 72% 94%, 58% 83%, 47% 96%, 35% 84%, 21% 93%, 12% 83%, 3% 88%);
          }

          #boot-photo {
            position: absolute;
            top: 434px;
            left: 28px;
            width: calc((100vw - 2.5rem) * 0.54);
            transform: rotate(-2deg);
            filter: drop-shadow(0 12px 14px rgba(48, 33, 22, 0.24));
          }

          #boot-photo img {
            display: block;
            width: 100%;
            height: auto;
          }

          #boot-photo .boot-tape {
            position: absolute;
            top: -12px;
            left: 50%;
            width: 96px;
            height: 24px;
            transform: translateX(-50%) rotate(-1deg);
            background: rgba(238, 226, 198, 0.88);
            box-shadow: 0 1.5px 4px rgba(73, 48, 34, 0.16);
            border-left: 1px dashed rgba(160, 135, 95, 0.45);
            border-right: 1px dashed rgba(160, 135, 95, 0.45);
            clip-path: polygon(0% 3px, 2% 0%, 98% 2%, 100% 5%, 98% 100%, 96% 96%, 3% 98%, 0% 93%);
          }

          @media (min-width: 640px) {
            #boot-title {
              top: 112px;
              font-size: 48px;
            }
            #boot-title .boot-rays {
              margin-top: -2rem;
            }
            #boot-photo {
              top: 512px;
              left: calc(50vw - 264px);
              width: 313.6px;
            }

          @media (min-width: 768px) {

            }

              top: 551px;
            }

              width: 281.5px;
            }

              font-size: 68px;

              left: calc(50vw - 14px);
              width: 313.6px;
            }

              left: calc(50vw + 12.7px);
            }

    <script>
      (function () {
        var shell = document.getElementById("boot-shell");
        if (window.location.pathname !== "/") {
          shell.remove();
          return;
        }
        var root = document.getElementById("root");
        var photo = shell.querySelector("#boot-photo img");
        var revealed = false;
        var reveal = function () {
          if (revealed) return;
          revealed = true;
          observer.disconnect();
          root.style.visibility = "";
          // Keep the boot node in the DOM so its early paint remains the LCP
          // candidate, but make it transparent so the real hero shows through.
          shell.style.transition = "opacity 120ms linear";
          shell.style.opacity = "0";
        };
        // Hide the real app until its hero image is ready, then swap in one
        // frame. This avoids the duplicated-title flash during hydration.
        root.style.visibility = "hidden";
        var observer = new MutationObserver(function () {
          if (root.children.length === 0) return;
          if (photo && !photo.complete) photo.addEventListener("load", reveal, { once: true });
          else reveal();
        });
        observer.observe(root, { childList: true });
        photo && photo.addEventListener("error", reveal, { once: true });
        setTimeout(function () {
          if (root.children.length > 0) reveal();
        }, 8000);
      })();
    </script>
